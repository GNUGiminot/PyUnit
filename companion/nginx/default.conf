# Компаньон сушилки: отдаёт новый интерфейс и проксирует PyUnit.
# Браузер видит один origin -> CORS не нужен, PyUnit не меняется ни строчкой.
server {
    listen 80;
    server_name _;
    root /srv/web;
    index index.html;

    # Внутренний DNS докера: нужен, чтобы nginx не падал при старте,
    # если сервис счётчика ещё не поднялся (имя резолвится на каждый запрос).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Оболочка приложения
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Android ставит PWA на главный экран, только если манифест отдан с
    # правильным типом; стандартный mime.types его не знает.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Эти файлы не кэшируем, иначе обновления не доезжают до телефона
    location = /index.html { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /sw.js      { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /app.js     { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /app.css    { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # API и WebSocket PyUnit. host.docker.internal = хост (см. extra_hosts в
    # compose): порт 5000 опубликован на хосте, так что маршрут не зависит
    # от того, в какой docker-сети живёт PyUnit.
    location /api/ {
        proxy_pass http://host.docker.internal:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Телеметрия идёт раз в секунду, но клиент ничего не шлёт:
        # без длинного таймаута nginx рвал бы WebSocket.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Счётчик сушек — сервис-компаньон
    location /stats {
        set $stats_upstream http://dryer-stats:8000;
        proxy_pass $stats_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
